name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Run tests
        run: go test ./... -count=1

      - name: Copy agents-guide for embed
        run: cp ../agents-guide.md mcp/agents-guide.md

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags="-s -w -X main.version=${VERSION}" -o sawmill ./cmd/sawmill

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar czf "sawmill-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" sawmill

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "${{ github.event.release.tag_name }}" \
            "sawmill-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
            --clobber
