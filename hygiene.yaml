# hygiene.yaml — declared, drift-validated hygiene posture for sawmill.
# Schema reference: the `hygiene` skill (~/.claude/skills/hygiene/SKILL.md).
# Validate with `/hygiene`; aggregate the fleet with `/hygiene fleet`.
# bullseye tracks aspirational state ("achieve X"); this tracks steady-state.
#
# Tiers are PER DIMENSION (schema v1). Held tier is the highest T such that
# every item in that dimension with tier <= T is satisfied. `floors` is the
# ratchet (below floor => DRIFT). `aspires` is the gap horizon. `enforce` is
# intent-only and does not affect tiers.
#
# Parent `/Users/marcelo/work/github.com/marcelocantos/go.work` lists only
# claudia and jevons. Local `go test`/`go build` from `go/` need GOWORK=off
# or they fail; that is an environment trap, not a sawmill source file.
# CI does not see the parent workspace.

schema_version: 1

repo: sawmill
aspires: 3
floors:            # per-dimension held-tier ratchet; below floor => DRIFT
  correctness: 2   # PR CI go test -race; release matrix builds three triples
  security: 2      # go/go.sum pin only; no secret scan, govulncheck, or CodeQL
  quality: 0       # no gofmt/vet/lint gate; go vet currently fails locally
  deps: 2          # go/go.sum committed; no Dependabot
  release: 2       # tag-triggered multi-arch build + Homebrew; MINOR-only tags
  governance: 2    # Apache-2.0 + README + .gitignore + squash-only
  build: 2         # Makefile + go.mod 1.26 pin used by CI
  docs: 1          # design/STABILITY/agents-guide exist; no doc CI
  perf: 0          # no Benchmark* suite
  vcs: 1           # committed pre-push runs make test; no pre-commit
  agent: 2         # CLAUDE.md, agents-guide.md, bullseye.yaml, --help-agent

tiers:
  1: baseline    # LICENSE + README + .gitignore; tests build & run
  2: maintained  # full matrix, examples run, lint/format, release + governance
  3: hardened    # formal specs, security scanning, SBOM/signing, fuzzing, perf

items:

  # ============================== CORRECTNESS =============================
  - id: correctness.tests
    dim: correctness
    desc: go test ./... -count=1 -race runs on every push/PR (go.yml#test)
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 1
    evidence: {ci_job: "go.yml#test"}

  - id: correctness.race
    dim: correctness
    desc: PR CI and make test invoke the race detector
    state: present
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence:
      {file: {path: .github/workflows/go.yml, matches: 'go test \./\.\.\. -count=1 -race'}}

  - id: correctness.release-multitarget
    dim: correctness
    desc: Release builds (and tests) across darwin-arm64, linux-amd64, linux-arm64
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {ci_job: "release.yml#build"}

  - id: correctness.release-race
    dim: correctness
    desc: Release job runs go test with -race before packaging
    state: planned
    cadence: per-release
    enforce: warning
    tier: 3
    reason: >-
      release.yml "Run tests" is `go test ./... -count=1` with no -race.
      PR CI is the only race gate (ENT-008).
    evidence:
      {absent: {file: {path: .github/workflows/release.yml, matches: '-race'}}}

  - id: correctness.os-matrix
    dim: correctness
    desc: PR tests run on macos-latest as well as ubuntu-latest
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: >-
      go.yml#test is ubuntu-latest only. Release covers darwin-arm64 and
      linux; watcher/fsnotify/paths have no PR job on macOS.
    evidence: {absent: {ci_job: "go.yml#macos"}}

  - id: correctness.windows
    dim: correctness
    desc: Windows CI / supported Windows binary
    state: skipped
    cadence: continuous
    enforce: informational
    tier: 3
    reason: >-
      Product is a loopback MCP daemon shipped via Homebrew. No Windows
      runner, formula, or claimed port.
    evidence: {absent: {ci_job: "go.yml#windows"}}

  - id: correctness.fuzzing
    dim: correctness
    desc: Fuzz harnesses over parsers / JS transform / merge inputs
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: 72 *_test.go files and no Fuzz* targets.
    evidence: {absent: {make_target: fuzz}}

  # =========================== SECURITY / SUPPLY ==========================
  - id: security.dep-pinning
    dim: security
    desc: go/go.sum is committed so the module graph stays reproducible
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {file: {path: go/go.sum}}

  - id: security.github-secret-scan
    dim: security
    desc: GitHub secret scanning enabled on the public repo
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: security_and_analysis.secret_scanning.status is disabled.
    evidence:
      {gh_setting: {key: security_and_analysis.secret_scanning.status, equals: enabled}}

  - id: security.push-protection
    dim: security
    desc: GitHub secret-scanning push protection enabled
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: secret_scanning_push_protection.status is disabled.
    evidence:
      {gh_setting: {key: security_and_analysis.secret_scanning_push_protection.status, equals: enabled}}

  - id: security.gitleaks
    dim: security
    desc: Secret scanning (gitleaks) in pre-commit and/or CI
    state: planned
    cadence: continuous
    enforce: blocking
    tier: 3
    reason: No gitleaks config or CI invocation. Review is still manual.
    evidence: {absent: {scanner: {tool: gitleaks}}}

  - id: security.dep-vuln-scan
    dim: security
    desc: govulncheck scans the locked Go module graph
    state: planned
    cadence: periodic:30d
    enforce: warning
    tier: 3
    reason: go/go.sum is pinned but no govulncheck, osv-scanner, or Dependabot job.
    evidence: {absent: {scanner: {tool: govulncheck}}}

  - id: security.sast-codeql
    dim: security
    desc: CodeQL static analysis runs on Go sources
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: No CodeQL workflow. go vet is not a CI gate either.
    evidence: {absent: {ci_job: "go.yml#codeql"}}

  - id: security.actions-perms
    dim: security
    desc: go.yml sets default token permissions to least privilege
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 3
    reason: go.yml has no top-level permissions block. release.yml scopes contents write.
    evidence: {file: {path: .github/workflows/go.yml, matches: '(?m)^permissions:'}}

  - id: security.signed-releases
    dim: security
    desc: Release artifacts carry provenance or a cosign signature
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: >-
      release.yml uploads tarballs via gh release and sets skip_checksum
      true on the Homebrew job. No signing step.
    evidence: {absent: {ci_step: {workflow: release.yml, name: Sign}}}

  # ============================== CODE QUALITY ============================
  - id: quality.vet
    dim: quality
    desc: go vet runs on every code CI pass
    state: planned
    cadence: continuous
    enforce: blocking
    tier: 2
    reason: >-
      CI does not run go vet. Local `go vet ./...` currently fails
      (unreachable code in watcher_test.go; ENT-008).
    evidence: {absent: {ci_step: {workflow: go.yml, name: Vet}}}

  - id: quality.format
    dim: quality
    desc: Sources stay gofmt-clean, checked in CI
    state: planned
    cadence: continuous
    enforce: warning
    tier: 2
    reason: >-
      CI does not run gofmt -l. The tree has unformatted Go files (ENT-008).
    evidence: {absent: {ci_step: {workflow: go.yml, name: gofmt}}}

  - id: quality.golangci
    dim: quality
    desc: golangci-lint runs with a committed config
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: No .golangci.yml and no golangci-lint or staticcheck job.
    evidence: {absent: {file: {path: .golangci.yml}}}

  # =========================== DEPENDENCY HEALTH ==========================
  - id: deps.go-sum
    dim: deps
    desc: Direct Go modules are locked in go/go.sum
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: go/go.sum}}

  - id: deps.dependabot
    dim: deps
    desc: Dependabot or equivalent opens PRs for Go module and Actions updates
    state: planned
    cadence: periodic:7d
    enforce: informational
    tier: 3
    reason: No .github/dependabot.yml. GitHub Dependabot security updates are disabled.
    evidence: {absent: {file: {path: .github/dependabot.yml}}}

  # ========================== RELEASE & VERSIONING =======================
  - id: release.ci-built
    dim: release
    desc: Release binaries are built by CI (darwin/arm64, linux/amd64, linux/arm64)
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {ci_job: "release.yml#build"}

  - id: release.homebrew
    dim: release
    desc: Published to the Homebrew tap on release, via tapper from the dev Mac
    state: present
    cadence: per-release
    enforce: informational
    tier: 2
    reason: >-
      Moved off the homebrew-releaser CI job on 2026-08-31 (T59). That job
      needed a per-repo HOMEBREW_TAP_TOKEN secret which is write-only, so it
      looked healthy until the PAT lapsed and then failed with an opaque 401,
      always after the tag was cut. tapper runs the same image locally with
      the token in the keychain, keyed by tap.
    evidence: {file: {path: tapper.yaml, matches: 'homebrew-tap'}}

  - id: release.semver-minor
    dim: release
    desc: Git tags are MINOR-only (vMAJOR.MINOR.0)
    state: enforced
    cadence: per-release
    enforce: blocking
    tier: 2
    evidence:
      command: test -z "$(git tag | grep -vE '^v[0-9]+\.[0-9]+\.0$')"

  - id: release.changelog
    dim: release
    desc: A maintained CHANGELOG records user-visible changes per release
    state: planned
    cadence: per-release
    enforce: warning
    tier: 3
    reason: History lives in git, GitHub release notes, and docs/audit-log.md; no CHANGELOG.md.
    evidence: {absent: {file: {path: CHANGELOG.md}}}

  - id: release.sbom
    dim: release
    desc: Each release attaches a software bill of materials
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: The release job packages tarballs. It does not emit an SBOM.
    evidence: {absent: {ci_step: {workflow: release.yml, name: SBOM}}}

  # ============================ GOVERNANCE / META ========================
  - id: governance.license
    dim: governance
    desc: Apache-2.0 LICENSE is present
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: LICENSE, matches: 'Apache License'}}

  - id: governance.readme
    dim: governance
    desc: README.md describes purpose, install, and MCP usage
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: README.md, matches: 'brew install marcelocantos/tap/sawmill'}}

  - id: governance.gitignore
    dim: governance
    desc: .gitignore covers binaries, IDE/OS files, and .env
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: .gitignore, matches: '/bin/'}}

  - id: governance.squash-only
    dim: governance
    desc: GitHub allows squash-merge only and deletes the branch
    state: enforced
    cadence: once-must-hold
    enforce: blocking
    tier: 2
    evidence: {gh_setting: {key: allow_merge_commit, equals: false}}

  - id: governance.notices
    dim: governance
    desc: THIRD_PARTY_NOTICES.md attributes statically linked Go modules
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: THIRD_PARTY_NOTICES.md, matches: 'Linked Go modules'}}

  - id: governance.security-md
    dim: governance
    desc: SECURITY.md documents the vulnerability-disclosure process
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Public repo without a published disclosure policy.
    evidence: {absent: {file: {path: SECURITY.md}}}

  - id: governance.codeowners
    dim: governance
    desc: CODEOWNERS assigns review owners for protected paths
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Solo-owned repo; no CODEOWNERS file.
    evidence: {absent: {file: {path: CODEOWNERS}}}

  - id: governance.branch-protection
    dim: governance
    desc: Default branch (master) is protected with required checks
    state: planned
    cadence: once-must-hold
    enforce: blocking
    tier: 3
    reason: gh api branches/master/protection returns 404; no required CI.
    evidence: {absent: {gh_setting: {key: protected, equals: true}}}

  # ================================= BUILD ===============================
  - id: build.makefile
    dim: build
    desc: Top-level Makefile builds the CLI binary to bin/sawmill
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {make_target: build}

  - id: build.go-version
    dim: build
    desc: go.mod pins the Go toolchain (go 1.26.1)
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 2
    evidence: {file: {path: go/go.mod, matches: '(?m)^go 1\.26'}}

  - id: build.ci-uses-mod
    dim: build
    desc: CI installs Go from go/go.mod (go-version-file)
    state: present
    cadence: continuous
    enforce: warning
    tier: 2
    evidence:
      {file: {path: .github/workflows/go.yml, matches: 'go-version-file: go/go.mod'}}

  - id: build.gowork-off
    dim: build
    desc: Makefile sets GOWORK=off so parent go.work cannot break local tests
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 3
    reason: >-
      Satisfied 2026-08-31. The parent go.work lists claudia, jevons and
      vellum, so every Makefile target failed at setup with "directory prefix
      . does not contain modules listed in go.work" — which meant the pre-push
      hook reported an error instead of a test result, and had been silently
      inert. `export GOWORK = off` scopes the gate to this repo.
    evidence: {file: {path: Makefile, matches: 'GOWORK'}}

  # ============================ DOCUMENTATION ============================
  - id: docs.design
    dim: docs
    desc: docs/design.md is the architecture write-up
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 1
    evidence: {file: {path: docs/design.md}}

  - id: docs.stability
    dim: docs
    desc: STABILITY.md catalogues the public CLI and MCP surface
    state: present
    cadence: per-release
    enforce: warning
    tier: 1
    evidence: {file: {path: STABILITY.md, matches: 'MCP tools'}}

  - id: docs.agents-guide
    dim: docs
    desc: agents-guide.md is the shipped agent-facing product guide
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: agents-guide.md}}

  - id: docs.stability-ci
    dim: docs
    desc: CI checks STABILITY.md tool catalogue against Definitions()
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: >-
      STABILITY.md already disagrees with the tool list (ENT-003). No
      catalogue-parity job.
    evidence: {absent: {ci_job: "go.yml#stability-surface"}}

  - id: docs.md-links
    dim: docs
    desc: Internal markdown links resolve (no dead cross-references)
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: Docs exist but are not link-checked in CI.
    evidence: {absent: {make_target: check-md-links}}

  - id: docs.todo
    dim: docs
    desc: docs/TODO.md is not used as the repo TODO sink
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: >-
      Leftover docs/TODO.md (checked-off Rust-era items). Global convention
      uses bullseye.yaml; the file should be deleted.
    evidence: {absent: {file: {path: docs/TODO.md}}}

  # ============================== PERFORMANCE ===========================
  - id: perf.benchmarks
    dim: perf
    desc: Go benchmark suite exists and is invocable
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: No Benchmark* tests and no make bench target.
    evidence: {absent: {make_target: bench}}

  # ============================== VCS / HISTORY =========================
  - id: vcs.pre-push
    dim: vcs
    desc: Committed pre-push hook runs make test (CI-identical)
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: scripts/hooks/pre-push, matches: 'make test'}}

  - id: vcs.pre-commit-hook
    dim: vcs
    desc: Committed pre-commit hook gates locally before commit
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: scripts/hooks has pre-push only. Enable via core.hooksPath.
    evidence: {absent: {file: {path: scripts/hooks/pre-commit}}}

  # =================== AGENT-READINESS / ONBOARDING ====================
  - id: agent.claude-md
    dim: agent
    desc: CLAUDE.md present (repo-local agent conventions)
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: CLAUDE.md}}

  - id: agent.agents-guide
    dim: agent
    desc: agents-guide.md present and served via --help-agent
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: agents-guide.md}}

  - id: agent.bullseye
    dim: agent
    desc: bullseye.yaml records convergence targets
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: bullseye.yaml}}

  - id: agent.cli-help
    dim: agent
    desc: Binary exposes version and --help-agent
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: go/cmd/sawmill/main.go, matches: '"--help-agent"'}}

  - id: agent.agents-md
    dim: agent
    desc: AGENTS.md present as the shared multi-tool instruction file
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Repo uses CLAUDE.md only; no AGENTS.md adapter split yet.
    evidence: {absent: {file: {path: AGENTS.md}}}
